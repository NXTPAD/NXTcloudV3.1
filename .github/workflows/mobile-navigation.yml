name: Apply mobile header navigation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-mobile-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch mobile navigation
        run: |
          python3 - <<'PY'
          import re, zipfile
          from pathlib import Path

          zips = list(Path('.').glob('*.zip'))
          if not zips:
              raise SystemExit('No ZIP archive found')

          zip_path = zips[0]
          tmp_path = zip_path.with_suffix('.mobile-nav.tmp.zip')

          script = r'''<script id="nxt-mobile-nav-pill-script">
          (function () {
            if (window.__nxtMobileNavInstalled) return;
            window.__nxtMobileNavInstalled = true;

            function mobile() {
              return window.matchMedia('(max-width: 700px)').matches;
            }

            function apply() {
              var oldPill = document.querySelector('.nxt-mobile-nav-pill');
              var wallet = null;

              document.querySelectorAll('button, a, [role="button"]').forEach(function (el) {
                var text = (el.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
                if (!wallet && text === 'connect wallet') wallet = el;
              });

              if (!mobile()) {
                if (oldPill) oldPill.remove();
                if (wallet) {
                  wallet.style.removeProperty('display');
                  wallet.removeAttribute('data-nxt-mobile-wallet');
                }
                return;
              }

              if (!wallet) return;

              wallet.setAttribute('data-nxt-mobile-wallet', 'true');
              wallet.style.setProperty('display', 'none', 'important');

              if (oldPill) return;

              var pill = document.createElement('nav');
              pill.className = 'nxt-mobile-nav-pill';
              pill.setAttribute('aria-label', 'NXT navigation');
              pill.innerHTML =
                '<a href="/" aria-label="NXT CLOUD">CLOUD</a>' +
                '<a href="/#launchpad" aria-label="NXT PAD">PAD</a>' +
                '<a href="/#dex" aria-label="NXT DEX">DEX</a>' +
                '<a href="/#ai" aria-label="NXT AI">AI</a>';

              wallet.parentNode.insertBefore(pill, wallet);

              var style = document.createElement('style');
              style.id = 'nxt-mobile-nav-pill-style';
              style.textContent =
                '.nxt-mobile-nav-pill{display:flex;align-items:center;justify-content:center;gap:2px;padding:4px;border:1px solid rgba(120,190,255,.34);border-radius:999px;background:rgba(7,15,27,.82);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap;z-index:20}' +
                '.nxt-mobile-nav-pill a{display:flex;align-items:center;justify-content:center;height:36px;padding:0 10px;border-radius:999px;color:#eef7ff;text-decoration:none;font-size:12px;font-weight:650;letter-spacing:.02em}' +
                '.nxt-mobile-nav-pill a:active{background:rgba(91,190,255,.18)}' +
                '@media(min-width:701px){.nxt-mobile-nav-pill{display:none!important}}';
              document.head.appendChild(style);
            }

            apply();
            window.addEventListener('resize', apply, {passive:true});
            window.addEventListener('hashchange', apply, {passive:true});
            new MutationObserver(apply).observe(document.documentElement, {childList:true, subtree:true});
          })();
          </script>'''

          changed = False

          with zipfile.ZipFile(zip_path, 'r') as zin, zipfile.ZipFile(tmp_path, 'w', zipfile.ZIP_DEFLATED) as zout:
            for info in zin.infolist():
              data = zin.read(info.filename)
              if info.filename.lower().endswith(('.html', '.htm')):
                try:
                  text = data.decode('utf-8')
                except UnicodeDecodeError:
                  text = None

                if text is not None and 'nxt-mobile-nav-pill-script' not in text:
                  if re.search(r'</body\s*>', text, re.I):
                    text = re.sub(r'</body\s*>', script + '\n</body>', text, count=1, flags=re.I)
                  elif re.search(r'</html\s*>', text, re.I):
                    text = re.sub(r'</html\s*>', script + '\n</html>', text, count=1, flags=re.I)
                  else:
                    text += '\n' + script + '\n'
                  data = text.encode('utf-8')
                  changed = True

              zout.writestr(info, data)

          if not changed:
            tmp_path.unlink(missing_ok=True)
            print('Archive already contains the mobile navigation patch; no change needed.')
          else:
            tmp_path.replace(zip_path)
            print('Mobile-only navigation patch applied.')

      - name: Commit patched archive
        run: |
          if git diff --quiet -- '*.zip'; then
            echo "No archive changes to commit."
            exit 0
          fi
          git config user.name "NXT"
          git config user.email "noreply@nxtcloud.local"
          git add '*.zip'
          git commit -m "Replace mobile wallet button with navigation pill"
          git push
