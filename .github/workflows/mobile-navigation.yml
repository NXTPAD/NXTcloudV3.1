name: Apply mobile header navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-mobile-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect archive
        run: |
          set -eux
          ls -lah
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          python3 - "$ZIP" <<'PY'
          import sys, zipfile
          p=sys.argv[1]
          print("ZIP:", p)
          print("SIZE:", __import__("os").path.getsize(p))
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              print("ENTRIES:", len(names))
              print("HTML:", [n for n in names if n.lower().endswith(('.html','.htm'))][:30])
          PY

      - name: Patch mobile navigation
        run: |
          python3 - <<'PY'
          import re, zipfile
          from pathlib import Path

          zip_path = next(Path('.').glob('*.zip'))
          tmp_path = Path(str(zip_path) + '.tmp')

          js = """<script id="nxt-mobile-nav-pill-script">
          (function () {
            if (window.__nxtMobileNavInstalled) return;
            window.__nxtMobileNavInstalled = true;
            function isMobile(){ return window.matchMedia('(max-width: 700px)').matches; }
            function apply(){
              var wallet=null;
              document.querySelectorAll('button,a,[role="button"]').forEach(function(el){
                var t=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
                if(!wallet && t==='connect wallet') wallet=el;
              });
              var pill=document.querySelector('.nxt-mobile-nav-pill');
              if(!isMobile()){
                if(pill) pill.remove();
                if(wallet){ wallet.style.removeProperty('display'); wallet.removeAttribute('data-nxt-mobile-wallet'); }
                return;
              }
              if(!wallet || pill) return;
              wallet.setAttribute('data-nxt-mobile-wallet','true');
              wallet.style.setProperty('display','none','important');
              pill=document.createElement('nav');
              pill.className='nxt-mobile-nav-pill';
              pill.setAttribute('aria-label','NXT navigation');
              pill.innerHTML='<a href="/">CLOUD</a><a href="/#launchpad">PAD</a><a href="/#dex">DEX</a><a href="/#ai">AI</a>';
              wallet.parentNode.insertBefore(pill,wallet);
              var style=document.createElement('style');
              style.textContent='.nxt-mobile-nav-pill{display:flex;align-items:center;justify-content:center;gap:2px;padding:4px;border:1px solid rgba(120,190,255,.34);border-radius:999px;background:rgba(7,15,27,.82);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap;z-index:20}.nxt-mobile-nav-pill a{display:flex;align-items:center;justify-content:center;height:36px;padding:0 10px;border-radius:999px;color:#eef7ff;text-decoration:none;font-size:12px;font-weight:650;letter-spacing:.02em}.nxt-mobile-nav-pill a:active{background:rgba(91,190,255,.18)}@media(min-width:701px){.nxt-mobile-nav-pill{display:none!important}}';
              document.head.appendChild(style);
            }
            apply();
            addEventListener('resize',apply,{passive:true});
            addEventListener('hashchange',apply,{passive:true});
            new MutationObserver(apply).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>"""

          changed=False
          with zipfile.ZipFile(zip_path,'r') as zin, zipfile.ZipFile(tmp_path,'w',zipfile.ZIP_DEFLATED) as zout:
            for info in zin.infolist():
              data=zin.read(info.filename)
              if info.filename.lower().endswith(('.html','.htm')):
                try: text=data.decode('utf-8')
                except UnicodeDecodeError: text=None
                if text is not None and 'nxt-mobile-nav-pill-script' not in text:
                  text=re.sub(r'</body\s*>',lambda m: js+'\n'+m.group(0),text,count=1,flags=re.I)
                  data=text.encode('utf-8')
                  changed=True
              zout.writestr(info,data)
          if not changed:
            tmp_path.unlink(missing_ok=True)
            print('No HTML needed patching.')
          else:
            tmp_path.replace(zip_path)
            print('Patched archive:', zip_path)
          PY

      - name: Commit patched archive
        run: |
          git config user.name "NXT"
          git config user.email "noreply@nxtcloud.local"
          git add '*.zip'
          if git diff --cached --quiet; then
            echo "No archive changes."
          else
            git commit -m "Replace mobile wallet button with navigation pill"
            git push
          fi
