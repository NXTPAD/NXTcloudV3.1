name: Move Cloud Hero Logo On Mobile
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cloud hero
        run: |
          python3 - <<'PY'
          import zipfile, tempfile, os, glob, re, shutil
          zpath=glob.glob('*.zip')[0]
          marker='nxt-cloud-mobile-hero-logo'
          with zipfile.ZipFile(zpath,'r') as zin:
              files={n:zin.read(n) for n in zin.namelist()}
          html_name=None
          for n,b in files.items():
              if n.lower().endswith(('.html','.htm')):
                  s=b.decode('utf-8','ignore')
                  if 'Every chain.' in s and 'One cloud.' in s:
                      html_name=n
                      break
          if not html_name:
              raise SystemExit('Cloud home HTML not found')
          s=files[html_name].decode('utf-8','ignore')
          if marker not in s:
              patch=r'''
          <style id="nxt-cloud-mobile-hero-logo">
          @media (max-width:700px){
            #home .hero-in{display:flex!important;flex-direction:column!important;}
            #home .hero-in .scene{order:-1!important;width:min(100%,560px)!important;height:auto!important;margin:0 auto 18px!important;}
            #home .hero-in .hero-copy{order:1!important;}
          }
          </style>
          <script>
          (function(){
            var scene,copy,parent,originalNext;
            function apply(){
              var home=document.getElementById('home');
              if(!home) return;
              parent=home.querySelector('.hero-in');
              scene=home.querySelector('.hero-in .scene');
              copy=home.querySelector('.hero-in .hero-copy');
              if(!parent||!scene||!copy) return;
              if(window.matchMedia('(max-width:700px)').matches){
                if(scene.parentNode===parent) parent.insertBefore(scene,copy);
              }else{
                if(scene.parentNode===parent && scene.nextElementSibling!==copy) parent.insertBefore(copy,scene);
                if(scene.parentNode===parent && scene!==parent.lastElementChild) parent.appendChild(scene);
              }
            }
            apply();
            window.addEventListener('resize',apply,{passive:true});
            window.addEventListener('hashchange',apply,{passive:true});
            new MutationObserver(apply).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          '''
              s=re.sub(r'</bodys*>',lambda m: patch+'\n'+m.group(0),s,count=1,flags=re.I)
              files[html_name]=s.encode('utf-8')
          tmp=zpath+'.tmp'
          with zipfile.ZipFile(tmp,'w') as zout:
              with zipfile.ZipFile(zpath,'r') as zin:
                  for info in zin.infolist():
                      data=files[info.filename]
                      zout.writestr(info,data)
          os.replace(tmp,zpath)
          print('Patched:',html_name)
          PY
          git config user.name "NXT"
          git config user.email "noreply@nxtcloud.local"
          git add *.zip
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Move Cloud hero logo above heading on mobile"
          git push
