name: Inspect Cloud Mobile Layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ZIP
        run: |
          python3 - <<'PY'
          import zipfile, re
          z=[x for x in __import__('glob').glob('*.zip')][0]
          print("ZIP:",z)
          with zipfile.ZipFile(z) as f:
              for n in f.namelist():
                  if n.lower().endswith(('.html','.htm')):
                      s=f.read(n).decode('utf-8','ignore')
                      low=s.lower()
                      if 'every chain' in low or 'one cloud' in low:
                          print("\n=== FILE",n,"===")
                          for term in ['every chain','one cloud']:
                              p=low.find(term)
                              if p>=0:
                                  print(s[max(0,p-3000):p+5000])
          PY
